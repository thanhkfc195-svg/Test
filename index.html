<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jerry Mod Studio </title>
<style>
  :root{
    --bg:#0b0f0d;
    --panel:#121815;
    --line:#1f2b25;
    --text:#dfeee6;
    --dim:#7fa393;
    --accent:#3ddc84;
    --accent-dim:#245c3f;
    --bad:#ff6b6b;
    --mono: "IBM Plex Mono", "SFMono-Regular", Menlo, Consolas, monospace;
    --sans: "IBM Plex Sans", -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: light){
    :root{
      --bg:#f6f7f9; --panel:#fff; --text:#14171c; --dim:#5d6673; --line:#dfe3e9;
      --accent:#2f6fed; --accent-dim:#1d4ed8; --bad:#c0392b;
    }
  }
  *{box-sizing:border-box;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    min-height:100vh;
    padding:28px 16px 80px;
  }
  .wrap{max-width:880px;margin:0 auto;}

  header{margin-bottom:24px;}
  .eyebrow{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--accent);
    display:flex;align-items:center;gap:8px;
    margin-bottom:8px;
  }
  .eyebrow::before{content:"";width:7px;height:7px;background:var(--accent);border-radius:1px;display:inline-block;}
  h1{
    font-family:var(--mono);
    font-size:clamp(22px,4vw,30px);
    font-weight:600;
    margin:0 0 6px;
  }
  h1 span{color:var(--accent);}
  .sub{color:var(--dim);font-size:14px;line-height:1.5;max-width:65ch;}

  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:20px;
    margin-top:16px;
  }
  .panel h2{font-size:16px;font-family:var(--mono);margin:0 0 12px;color:var(--text);}

  .drop{
    border:1.5px dashed var(--line);
    border-radius:8px;
    padding:30px 16px;
    text-align:center;
    cursor:pointer;
    transition:border-color .15s, background .15s;
    font-family:var(--mono);
    background:var(--panel);
  }
  .drop.has{border-color:var(--accent);border-style:solid;}
  .drop .big{font-size:14px;color:var(--text);margin-bottom:6px;}
  .drop .small{font-size:12px;color:var(--dim);}
  input[type=file]{display:none;}

  button{
    font-family:var(--mono);
    font-size:13px;
    font-weight:500;
    padding:11px 20px;
    border-radius:6px;
    border:1px solid var(--accent-dim);
    background:var(--accent);
    color:#08130d;
    cursor:pointer;
    transition:opacity .15s;
  }
  button:hover:not(:disabled){opacity:.85;}
  button:disabled{opacity:.35;cursor:not-allowed;}
  .row{display:flex;gap:10px;align-items:center;}

  .msg{border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:12px;border:1px solid;font-family:var(--mono);}
  .msg.ok{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 35%,transparent);background:color-mix(in srgb,var(--accent) 9%,transparent)}
  .msg.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,transparent);background:color-mix(in srgb,var(--bad) 9%,transparent)}

  .config-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:10px;}
  .config-item{background:var(--bg);padding:10px;border-radius:8px;display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);}
  .config-item label{font-size:12px;font-weight:500;color:var(--dim);font-family:var(--mono);}
  .config-item input[type="color"]{width:100%;height:28px;border:none;border-radius:4px;cursor:pointer;background:transparent;}

  table.hex{font-family:var(--mono);font-size:11.5px;width:100%;border-collapse:collapse;margin-top:10px;}
  table.hex th{text-align:left;color:var(--dim);padding:0 12px 6px 0;border-bottom:1px solid var(--line)}
  table.hex td{padding:6px 12px 6px 0;border-bottom:1px solid var(--line);word-break:break-all;}
  .new{color:var(--accent)} .dim{color:var(--dim)}
  .hexwrap{overflow-x:auto;}
  .fname{font-family:var(--mono);font-size:12.5px;background:var(--bg);padding:8px 10px;border-radius:7px;display:block;margin-top:6px;border:1px solid var(--line);}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="eyebrow">Jerry Mod Studio — Định Vị Skin Súng </div>
    <h1>TOOL MAKE ĐỊNH VỊ <span>SKIN SÚNG</span></h1>
    <p class="sub">Tool Thuộc Bản Quyền Jerry Mod.</p>
  </header>

  <div class="panel">
    <div id="drop" class="drop">
      <div id="dropText">
        <b>Thả file bundle vào đây</b>
        <span>hoặc bấm để chọn file cần mod định vị skin</span>
      </div>
      <input type="file" id="file" class="hide">
    </div>
    <div id="info"></div>
  </div>

  <div class="panel">
    <h2>Bảng điều khiển màu sắc định vị</h2>
    <p class="sub" style="margin-bottom:10px">Tùy chỉnh trực quan các thông số được ánh xạ vào bộ nhớ đệm Hex.</p>
    <div class="config-grid" id="presetControls"></div>
  </div>

  <div class="panel">
    <h2>Chức năng tự động</h2>
    <div class="row">
      <button id="go" disabled>CHẠY LỆNH </button>
    </div>
  </div>

  <div id="out"></div>

</div>

  function hexToBytes(hex) {
    const clean = hex.replace(/\s+/g, '');
    const bytes = new Uint8Array(clean.length / 2);
    for (let i = 0; i < clean.length; i += 2) {
      bytes[i / 2] = parseInt(clean.substring(i, i + 2), 16);
    }
    return bytes;
  }

  let baseShaderBody = hexToBytes(AUTO_CONFIG.rawHexSource);

  function lz4dec(src, outSize){
    const dst = new Uint8Array(outSize);
    const n = src.length;
    let i = 0, o = 0;
    while (i < n){
      const tok = src[i++];
      let lit = tok >> 4;
      if (lit === 15){ let b; do { b = src[i++]; lit += b; } while (b === 255); }
      if (lit){ dst.set(src.subarray(i, i + lit), o); i += lit; o += lit; }
      if (i >= n) break;
      const off = src[i] | (src[i+1] << 8); i += 2;
      let ml = tok & 15;
      if (ml === 15){ let b; do { b = src[i++]; ml += b; } while (b === 255); }
      ml += 4;
      let sp = o - off;
      for (let k = 0; k < ml; k++) dst[o++] = dst[sp++];
    }
    return dst;
  }

  function lz4enc(src){
    const n = src.length;
    if (!n) return new Uint8Array(0);
    const out = [];
    const HLOG = 16, HSIZE = 1 << HLOG;
    const head = new Int32Array(HSIZE).fill(-1);
    const prev = new Int32Array(n).fill(-1);
    const MFLIMIT = 12, LASTLIT = 5, MAXDIST = 65535, CHAIN = 32;
    const h4 = i => (Math.imul((src[i] | (src[i+1]<<8) | (src[i+2]<<16) | (src[i+3]<<24)) >>> 0, 2654435761) >>> (32 - HLOG));
    const same4 = (a, b) => src[a]===src[b] && src[a+1]===src[b+1] && src[a+2]===src[b+2] && src[a+3]===src[b+3];
    const emit = (ls, le, mlen, moff) => {
      const litlen = le - ls;
      const ml = mlen ? mlen - 4 : 0;
      out.push(((litlen >= 15 ? 15 : litlen) << 4) | (ml >= 15 ? 15 : ml));
      if (litlen >= 15){ let r = litlen - 15; while (r >= 255){ out.push(255); r -= 255; } out.push(r); }
      for (let k = ls; k < le; k++) out.push(src[k]);
      if (mlen){
        out.push(moff & 255, (moff >> 8) & 255);
        if (ml >= 15){ let r = ml - 15; while (r >= 255){ out.push(255); r -= 255; } out.push(r); }
      }
    };
    let anchor = 0, i = 0;
    while (i < n - MFLIMIT){
      const hv = h4(i);
      let bestLen = 0, bestOff = 0, cur = head[hv], cnt = 0;
      while (cur >= 0 && cnt < CHAIN){
        const off = i - cur;
        if (off > MAXDIST) break;
        if (same4(cur, i)){
          let l = 4; const lim = n - LASTLIT - i;
          while (l < lim && src[cur+l] === src[i+l]) l++;
          if (l > bestLen){ bestLen = l; bestOff = off; if (l >= 255) break; }
        }
        cur = prev[cur]; cnt++;
      }
      prev[i] = head[hv]; head[hv] = i;
      if (bestLen >= 4){
        emit(anchor, i, bestLen, bestOff);
        const stop = Math.min(i + bestLen, n - 3);
        for (let k = i + 1; k < stop; k++){ const hk = h4(k); prev[k] = head[hk]; head[hk] = hk; }
        i += bestLen; anchor = i;
      } else i++;
    }
    const litlen = n - anchor;
    out.push((litlen >= 15 ? 15 : litlen) << 4);
    if (litlen >= 15){ let r = litlen - 15; while (r >= 255){ out.push(255); r -= 255; } out.push(r); }
    for (let k = anchor; k < n; k++) out.push(src[k]);
    return new Uint8Array(out);
  }

  function lz4Trace(src, outSize){
    const litOf  = new Int32Array(outSize).fill(-1);
    const copyOf = new Int32Array(outSize).fill(-1);
    let i = 0, o = 0;
    while (i < src.length && o < outSize){
      const tok = src[i++];
      let lit = tok >> 4;
      if (lit === 15){ let b; do { b = src[i++]; lit += b; } while (b === 255); }
      for (let k = 0; k < lit; k++){ litOf[o++] = i++; }
      if (i >= src.length) break;
      const off = src[i] | (src[i+1] << 8); i += 2;
      let ml = tok & 15;
      if (ml === 15){ let b; do { b = src[i++]; ml += b; } while (b === 255); }
      ml += 4;
      let sp = o - off;
      for (let k = 0; k < ml; k++){ copyOf[o] = sp; o++; sp++; }
    }
    const root = new Int32Array(outSize).fill(-1);
    for (let k = 0; k < outSize; k++){
      let cur = k, guard = 0;
      while (litOf[cur] < 0 && copyOf[cur] >= 0 && guard++ < outSize) cur = copyOf[cur];
      root[k] = litOf[cur] >= 0 ? litOf[cur] : -1;
    }
    return root;
  }

  function readShaderProps(body){
    const dv = new DataView(body.buffer, body.byteOffset, body.byteLength);
    let p = 0;
    const rd = () => { const v = dv.getInt32(p, true); p += 4; return v; };
    const str = () => {
      const n = rd();
      if (n < 0 || p + n > body.length) throw new Error('Lỗi cấu trúc shader');
      const s = new TextDecoder().decode(body.subarray(p, p + n));
      p = (p + n + 3) & ~3;
      return s;
    };
    str();
    const cnt = rd();
    const props = [];
    for (let i = 0; i < cnt; i++){
      const name = str(), desc = str();
      const na = rd();
      for (let k = 0; k < na; k++) str();
      const type = rd();
      p += 4;
      const valOff = p;
      const val = [dv.getFloat32(p,true), dv.getFloat32(p+4,true), dv.getFloat32(p+8,true), dv.getFloat32(p+12,true)];
      p += 16;
      str(); p += 4;
      props.push({ name, type, valOff, val });
    }
    return props;
  }

  function initHexColorUI() {
    const container = document.getElementById('presetControls');
    container.innerHTML = '';
    let props = [];
    try { props = readShaderProps(baseShaderBody); } catch(e) { return; }

    AUTO_CONFIG.propertiesToEdit.forEach(propName => {
      const prop = props.find(p => p.name === propName);
      if (!prop) return;
      const div = document.createElement('div');
      div.className = 'config-item';
      if (propName.toLowerCase().includes('color')) {
        const [r, g, b] = prop.val;
        const hexColor = "#" + [r,g,b].map(v => Math.round(Math.max(0, Math.min(1, v)) * 255).toString(16).padStart(2, '0')).join('');
        div.innerHTML = `<label>${propName}</label><input type="color" value="${hexColor}" data-prop="${propName}">`;
      } else {
        div.innerHTML = `<label>${propName} </label><input type="number" step="0.1" value="${prop.val[0]}" data-prop="${propName}" style="width:100%; padding:6px; background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:4px;">`;
      }
      container.appendChild(div);
    });

    container.addEventListener('input', e => {
      const target = e.target;
      const propName = target.dataset.prop;
      if (!propName) return;
      const prop = props.find(p => p.name === propName);
      const dv = new DataView(baseShaderBody.buffer, baseShaderBody.byteOffset, baseShaderBody.byteLength);
      if (target.type === 'color') {
        const hex = target.value;
        dv.setFloat32(prop.valOff, parseInt(hex.substr(1,2),16)/255, true);
        dv.setFloat32(prop.valOff+4, parseInt(hex.substr(3,2),16)/255, true);
        dv.setFloat32(prop.valOff+8, parseInt(hex.substr(5,2),16)/255, true);
      } else {
        dv.setFloat32(prop.valOff, parseFloat(target.value) || 0, true);
      }
    });
  }

  function parseBundle(u8){
    const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
    let p = 0;
    const cstr = () => { let s = ''; while (u8[p]) s += String.fromCharCode(u8[p++]); p++; return s; };
    const sig = cstr();
    if (sig !== 'UnityFS') throw new Error(`Không phải UnityFS bundle (${sig})`);
    
    const fmt = dv.getUint32(p, false); p += 4;
    cstr(); cstr();
    const declared = Number(dv.getBigInt64(p, false)); p += 8;
    const ciSize = dv.getUint32(p, false); p += 4;
    const uiSize = dv.getUint32(p, false); p += 4;
    const flags  = dv.getUint32(p, false); p += 4;
    
    let info, infoOff, dataStart = p;
    const ic = flags & 0x3F;

    if (flags & 0x80){
      dataStart = (p + 15) & ~15;
      const from = Math.min(declared, u8.length) - ciSize;
      let found = false;
      for (let off = from; off >= Math.max(0, from - 120000); off--){
        try {
          const cand = (ic === 2 || ic === 3) ? lz4dec(u8.subarray(off, off + ciSize), uiSize) : u8.subarray(off, off + ciSize).slice();
          if (cand.length >= 16) {
            info = cand;
            infoOff = off;
            found = true;
            break;
          }
        } catch(e) {}
      }
      if (!found) throw new Error('Không tìm thấy khối dữ liệu BlocksInfo ở cuối file.');
    } else {
      if (fmt >= 7 || (flags & 0x200)) p = (p + 15) & ~15;
      infoOff = p;
      dataStart = p + ciSize;
      const infoRaw = u8.subarray(p, p + ciSize);
      info = (ic === 2 || ic === 3) ? lz4dec(infoRaw, uiSize) : infoRaw.slice();
    }

    const idv = new DataView(info.buffer, info.byteOffset, info.byteLength);
    let q = 16;
    if (q + 4 > info.length) q = 0;
    
    const nB = idv.getUint32(q, false); q += 4;
    const blocks = [];
    for (let i = 0; i < nB; i++){
      if (q + 10 > info.length) break;
      blocks.push({ u: idv.getUint32(q,false), c: idv.getUint32(q+4,false), f: idv.getUint16(q+8,false) });
      q += 10;
    }

    const nN = idv.getUint32(q, false); q += 4;
    const nodes = [];
    for (let i = 0; i < nN; i++){
      if (q + 20 > info.length) break;
      const off = Number(idv.getBigInt64(q,false));
      const sz = Number(idv.getBigInt64(q+8,false));
      const nf = idv.getUint32(q+16,false); 
      q += 20;
      let nm = ''; 
      while (q < info.length && info[q]) {
        nm += String.fromCharCode(info[q++]);
      }
      q++;
      nodes.push({ off, size: sz, flags: nf, name: nm });
    }

    if (nodes.length === 0) {
      nodes.push({ off: 0, size: uiSize || u8.length, flags: 0, name: "default_shader_node" });
    }

    return { flags, blocks, nodes, dataStart, infoOff, info, declared, ciSize, uiSize };
  }

  function parseSF(cab){
    const dv = new DataView(cab.buffer, cab.byteOffset, cab.byteLength);
    const dataOffset = Number(dv.getBigInt64(32, false));
    let p = 48;
    const cstr = () => { let s=''; while (cab[p]) s += String.fromCharCode(cab[p++]); p++; return s; };
    cstr(); p += 5;
    
    const tcount = dv.getInt32(p, true); p += 4;
    const types = [];
    for (let i = 0; i < tcount; i++){
      const cid = dv.getInt32(p, true); p += 21;
      types.push({ cid });
    }
    
    const ocount = dv.getInt32(p, true); p += 4;
    const objs = [];
    for (let i = 0; i < ocount; i++){
      p = (p + 3) & ~3;
      const pid = dv.getBigInt64(p, true);
      const off = Number(dv.getBigInt64(p+8, true));
      const size = dv.getUint32(p+16, true);
      const tid = dv.getInt32(p+20, true);
      p += 24;
      
      // Kiểm tra an toàn: Nếu tid hợp lệ mới lấy cid, ngược lại gán mặc định là 48 (Shader)
      const cid = (types[tid] !== undefined) ? types[tid].cid : 48;
      objs.push({ pid, off, size, tid, cid });
    }
    return { dataOffset, objs };
  }


  function decompressAll(orig, b){
    let pos = b.dataStart, outPos = 0;
    const parts = [], blockAt = [];
    for (const blk of b.blocks){
      const raw = orig.subarray(pos, pos + blk.c);
      const ct = blk.f & 0x3F;
      const dec = (ct === 2 || ct === 3) ? lz4dec(raw, blk.u) : raw.slice();
      parts.push(dec);
      blockAt.push({ start: outPos, end: outPos + blk.u, comp: blk.c, srcOff: pos });
      outPos += blk.u; pos += blk.c;
    }
    const data = new Uint8Array(outPos);
    let w = 0; for (const p of parts){ data.set(p, w); w += p.length; }
    return { data, blockAt };
  }

  function rebuildShadersSmartLZ4(orig, b, data, blockAt, sf, node, repl){
    const touched = new Set();
    for (const o of sf.objs){
      const body = repl.get(o.pid);
      if (!body) continue;
      if (body.length !== o.size) {
        throw new Error(`Object ${o.pid} thay đổi kích thước (${o.size} → ${body.length}).`);
      }
      const abs = node.off + sf.dataOffset + o.off;
      data.set(body, abs);
      for (let i = 0; i < blockAt.length; i++){
        if (abs < blockAt[i].end && abs + body.length > blockAt[i].start) touched.add(i);
      }
    }
    if (!touched.size) throw new Error('Không có thay đổi nào được ghi nhận.');

    const parts = [], newBlocks = [];
    for (let i = 0; i < b.blocks.length; i++){
      const blk = b.blocks[i], at = blockAt[i];
      if (!touched.has(i)){
        parts.push(orig.subarray(at.srcOff, at.srcOff + blk.c));
        newBlocks.push({ u: blk.u, c: blk.c, f: blk.f });
        continue;
      }
      const raw = data.subarray(at.start, at.end);
      let comp, flags = blk.f;
      if ((blk.f & 0x3F) === 0){
        comp = raw;
      } else {
        comp = lz4enc(raw);
        if (comp.length >= raw.length){ comp = raw; flags = blk.f & ~0x3F; }
      }
      parts.push(comp);
      newBlocks.push({ u: blk.u, c: comp.length, f: flags });
    }

    const info = b.info.slice();
    const idv = new DataView(info.buffer, info.byteOffset, info.byteLength);
    let q = 20;
    for (const nb of newBlocks){
      idv.setUint32(q, nb.u, false);
      idv.setUint32(q + 4, nb.c, false);
      idv.setUint16(q + 8, nb.f, false);
      q += 10;
    }

    let infoOut;
    const ic = b.flags & 0x3F;
    if (ic === 0){
      infoOut = info;
    } else {
      const compOrig = orig.slice(b.infoOff, b.infoOff + b.ciSize);
      const root = lz4Trace(compOrig, b.uiSize);
      const patched = compOrig.slice();
      const want = new Map();
      for (let i = 0; i < info.length; i++){
        const src = root[i];
        if (src < 0){
          if (info[i] !== b.info[i]) throw new Error(`blocksInfo: byte ${i} không truy vết được.`);
          continue;
        }
        want.set(src, info[i]);
      }
      for (const [src, val] of want) patched[src] = val;
      infoOut = patched;
    }

    const dataLen = parts.reduce((a, x) => a + x.length, 0);
    const atEnd = !!(b.flags & 0x80);
    const headLen = atEnd ? b.dataStart : b.infoOff;
    let core = headLen + dataLen + infoOut.length;
    if (!atEnd && (b.flags & 0x200)) core = ((headLen + infoOut.length + 15) & ~15) + dataLen;
    if (core > orig.length) throw new Error('Dung lượng nén phình to hơn file gốc, không đủ chỗ đệm.');

    const out = new Uint8Array(orig.length);
    if (atEnd){
      out.set(orig.subarray(0, headLen), 0);
      let p = headLen;
      for (const x of parts){ out.set(x, p); p += x.length; }
      out.set(infoOut, p);
    } else {
      out.set(orig.subarray(0, b.infoOff), 0);
      out.set(infoOut, b.infoOff);
      let p = b.infoOff + infoOut.length;
      if (b.flags & 0x200) p = (p + 15) & ~15;
      for (const x of parts){ out.set(x, p); p += x.length; }
    }
    
    let sp = 0;
    let tempP = 0;
    while (out[tempP]) tempP++; tempP++; tempP += 4;
    while (out[tempP]) tempP++; tempP++;
    while (out[tempP]) tempP++; tempP++;
    sp = tempP;

    const odv = new DataView(out.buffer);
    odv.setBigInt64(sp, BigInt(atEnd ? core : out.length), false);
    odv.setUint32(sp + 8, infoOut.length, false);
    odv.setUint32(sp + 12, info.length, false);
    return out;
  }

  initHexColorUI();

  let FILE = null, ORIG = null, BUN = null;

  document.getElementById('file').addEventListener('change', async (e) => {
    const f = e.target.files[0];
    if (!f) return;
    FILE = f;
    ORIG = new Uint8Array(await f.arrayBuffer());
    try {
      BUN = parseBundle(ORIG);
      document.getElementById('dropText').innerHTML = `<b>${f.name}</b><span>${ORIG.length.toLocaleString('vi-VN')} byte — JERRY MOD&amp; VIP</span>`;
      document.getElementById('drop').classList.add('has');
      document.getElementById('go').disabled = false;
      document.getElementById('out').innerHTML = '';
      document.getElementById('info').innerHTML = '';
    } catch(err) {
      document.getElementById('out').innerHTML = '';
      document.getElementById('info').innerHTML = `<div class="msg bad">Lỗi phân tích file: ${err.message}</div>`;
    }
  });

  document.getElementById('go').addEventListener('click', async () => {
    const btn = document.getElementById('go');
    btn.disabled = true; btn.textContent = 'Đang make định vị & Đóng gói LZ4...';
    try {
      if (!BUN || !BUN.nodes || BUN.nodes.length === 0) {
        throw new Error('File bundle không chứa node dữ liệu hợp lệ.');
      }
      const node = BUN.nodes[0];
      const { data, blockAt } = decompressAll(ORIG, BUN);
      const cab = data.subarray(node.off, node.off + node.size);
      const sf = parseSF(cab);
      const repl = new Map();
      let count = 0;

      for (const targetQuery of AUTO_CONFIG.targetPathIDs){
        const targetObj = sf.objs.find(o => o.cid === 48 && o.pid.toString() === targetQuery);
        if (!targetObj) continue;
        
        let injectedBytes = new Uint8Array(targetObj.size);
        if (baseShaderBody.length >= targetObj.size) {
          injectedBytes.set(baseShaderBody.subarray(0, targetObj.size));
        } else {
          injectedBytes.set(baseShaderBody);
        }
        
        repl.set(targetObj.pid, injectedBytes);
        count++;
      }

      if (count === 0) throw new Error('Không tìm thấy PathID Shader mục tiêu phù hợp trong file này.');

      const finalOut = rebuildShadersSmartLZ4(ORIG, BUN, data, blockAt, sf, node, repl);

      document.getElementById('out').innerHTML = `
        <div class="panel">
          <div class="msg ok">Make định vị súng và <b>VÀ TỐI ƯU FILE thông minh thành công</b>!  ${count} Jerry Mod.</div>
          <h2>Tải xuống</h2>
          <span class="fname">${FILE.name}</span>
          <div class="row" style="margin-top:10px"><button id="dl">Tải file hoàn chỉnh</button></div>
        </div>`;

      document.getElementById('dl').onclick = () => {
        const url = URL.createObjectURL(new Blob([finalOut], { type: 'application/octet-stream' }));
        const a = document.createElement('a'); a.href = url; a.download = FILE.name;
        a.click(); URL.revokeObjectURL(url);
      };
    } catch(err) {
      document.getElementById('out').innerHTML = `<div class="msg bad">Lỗi thực thi: ${err.message}</div>`;
    } finally {
      btn.disabled = false; btn.textContent = 'CHẠY LỆNH ';
    }
  });

  const drop = document.getElementById('drop'), input = document.getElementById('file');
  drop.onclick = () => input.click();
  drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('has'); });
  drop.addEventListener('dragleave', e => { e.preventDefault(); drop.classList.remove('has'); });
  drop.addEventListener('drop', e => {
    e.preventDefault();
    const f = e.dataTransfer.files[0];
    if (f) {
      input.files = e.dataTransfer.files;
      input.dispatchEvent(new Event('change'));
    }
  });

})();
</script>
</body>
</html>
